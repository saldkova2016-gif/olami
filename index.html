<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Дашборд генератора расписаний</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&amp;family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6A35FF",
                        secondary: "#D946EF",
                        "background-light": "#F8F9FE",
                        "background-dark": "#121214",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E1E24",
                        "text-light": "#1F2937",
                        "text-dark": "#E5E7EB",
                        "border-light": "#E5E7EB",
                        "border-dark": "#2D2D35"
                    },
                    fontFamily: {
                        display: ["'Oswald'", "sans-serif"],
                        body: ["'Roboto'", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark font-body min-h-screen flex flex-col transition-colors duration-200">
    <nav class="bg-surface-light dark:bg-surface-dark border-b border-border-light dark:border-border-dark sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="font-display font-bold text-2xl text-primary tracking-wide">OLAMI<span class="text-black dark:text-white">GEN</span></span>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a class="border-primary text-gray-900 dark:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium" href="#">Дашборд</a>
                        <a class="border-transparent text-gray-500 dark:text-gray-400 hover:border-gray-300 hover:text-gray-700 dark:hover:text-gray-300 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium" href="#">Шаблоны</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="editor.html?id=new" class="bg-primary hover:bg-opacity-90 text-white px-4 py-2 rounded-md text-sm font-medium shadow-sm transition-colors flex items-center">
                        <span class="material-icons-outlined text-[20px] mr-1">add</span>
                        Создать расписание
                    </a>
                    <div class="ml-3 relative">
                        <div class="h-8 w-8 rounded-full bg-primary text-white flex items-center justify-center font-bold">A</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 py-10 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        <div class="md:flex md:items-center md:justify-between mb-8">
            <div class="flex-1 min-w-0">
                <h2 class="text-3xl font-bold leading-7 text-gray-900 dark:text-white sm:text-4xl sm:truncate font-display uppercase tracking-wide">
                    Последние расписания
                </h2>
                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                    Управляйте календарями еженедельных мероприятий.
                </p>
            </div>
            <div class="mt-4 flex md:mt-0 md:ml-4">
                <div class="relative rounded-md shadow-sm w-full max-w-xs">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <span class="material-icons-outlined text-gray-400">search</span>
                    </div>
                    <input class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-surface-dark text-gray-900 dark:text-white py-2" id="search" placeholder="Поиск..." type="text"/>
                </div>
            </div>
        </div>

        <div id="schedules-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Content Here -->

            <!-- Create New Card (Always Last) -->
            <a href="editor.html?id=new" class="group relative rounded-xl border-2 border-dashed border-gray-300 dark:border-gray-700 hover:border-primary dark:hover:border-primary bg-transparent flex flex-col items-center justify-center p-12 text-center transition-all cursor-pointer h-full min-h-[300px]">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-gray-100 dark:bg-gray-800 group-hover:bg-primary group-hover:text-white transition-colors text-gray-400 dark:text-gray-500">
                    <span class="material-icons-outlined text-2xl">add</span>
                </div>
                <h3 class="mt-2 text-sm font-medium text-gray-900 dark:text-white">Создать новое расписание</h3>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Начать с нуля.</p>
            </a>
        </div>
    </main>

    <script>
        function loadSchedules() {
            const grid = document.getElementById('schedules-grid');
            const createCard = grid.lastElementChild;

            // Look for keys starting with 'schedule-'
            const schedules = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('schedule-')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        schedules.push(data);
                    } catch (e) {
                        console.error('Failed to parse', key);
                    }
                }
            }

            // Render cards
            schedules.forEach(schedule => {
                const card = document.createElement('div');
                card.className = "group relative bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm hover:shadow-lg border border-border-light dark:border-border-dark transition-all duration-300 overflow-hidden flex flex-col";
                card.innerHTML = `
                    <div class="aspect-w-16 aspect-h-9 w-full bg-gray-100 dark:bg-gray-800 relative overflow-hidden h-48">
                        <div class="absolute inset-0 p-4 flex flex-col items-center justify-center transform group-hover:scale-105 transition-transform duration-500 bg-white dark:bg-[#1a1a20]">
                             <div class="w-full h-full border border-gray-200 dark:border-gray-700 p-2 flex flex-col gap-2 opacity-80">
                                <div class="text-center">
                                    <div class="text-primary font-display font-bold text-lg uppercase leading-none">Расписание</div>
                                    <div class="text-primary font-display font-bold text-xl uppercase leading-none truncate">${schedule.dateRange || 'Дата не указана'}</div>
                                </div>
                            </div>
                        </div>
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-all flex items-center justify-center opacity-0 group-hover:opacity-100">
                            <a href="editor.html?id=${schedule.id}" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-full p-3 shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-all">
                                <span class="material-icons-outlined">edit</span>
                            </a>
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-1">
                        <div class="flex justify-between items-start">
                            <div class="overflow-hidden">
                                <h3 class="text-lg font-bold text-gray-900 dark:text-white font-display truncate">${schedule.title || 'Без названия'}</h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 truncate">${schedule.dateRange || '...'}</p>
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t border-gray-100 dark:border-border-dark flex justify-between items-center">
                            <div class="text-xs font-medium text-gray-500 dark:text-gray-400">ID: ${schedule.id}</div>
                            <a href="editor.html?id=${schedule.id}" class="text-primary hover:text-secondary text-sm font-medium transition-colors">Редактировать →</a>
                        </div>
                    </div>
                `;
                grid.insertBefore(card, createCard);
            });
        }

        loadSchedules();
    </script>
</body>
</html>
